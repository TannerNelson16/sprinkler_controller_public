<style>

  --bg-color: #0b0f19;

body {
  background-color: var(--bg-color);

  width: 100%;

h1 {
  margin: 10px 0 20px 0;
  font-size: 1.6rem;

  background: linear-gradient(135deg, #f59e0b, #d97706);
  -webkit-background-clip: text;

}

#currentDateTime {
  font-size: 0.9rem;
  color: var(--text-secondary);
  background-color: rgba(30, 41, 59, 0.4);
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  margin-bottom: 20px;
  display: inline-block;
}

.zone-card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.zone-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 12px;
  margin-bottom: 15px;
}

.zone-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
  margin: 0;
}

/* Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 46px;
  height: 26px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #334155;
  transition: .25s;
  border-radius: 30px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .25s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--accent-emerald);
}

input:checked + .slider:before {
  transform: translateX(20px);
}

/* List of schedules */
.schedules-list {
  margin-bottom: 15px;
}

.schedule-item {
  background-color: rgba(0, 0, 0, 0.2);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 12px 15px;
  margin-bottom: 10px;

  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.schedule-details {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.schedule-days {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.day-badge-small {
  background-color: #334155;
  color: var(--text-primary);
  font-size: 0.7rem;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
}

.schedule-time {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.schedule-actions {
  display: flex;
  align-items: center;
  gap: 24px; /* Increased gap to prevent accidental clicks */
}

/* Add schedule form */
.add-schedule-form {
  border-top: 1px dashed var(--border-color);
  padding-top: 15px;
  margin-top: 15px;
}

.form-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.day-selector {
  display: flex;
  gap: 6px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.day-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background-color: #334155;
  color: var(--text-secondary);
  font-weight: bold;
  font-size: 0.8rem;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s;
}

.day-badge:hover {
  background-color: #475569;
}

.day-badge.active {
  background-color: var(--accent-blue);
  color: white;
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
}

.time-selector {
  display: flex;
  gap: 12px;
  margin-bottom: 15px;
}

.time-input-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.time-input-group label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 600;
}

input[type="time"] {
  background-color: rgba(0, 0, 0, 0.2);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 10px;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}

input[type="time"]:focus {

.btn {
  border: none;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;

.btn-add {
  background-color: var(--accent-blue);

  padding: 10px 16px;

.btn-add:hover {

.btn-danger {

.nav-item {

.nav-icon {

body.sending-command #zonesContainer {
  pointer-events: none;
  opacity: 0.6;
  transition: opacity 0.15s ease-in-out;
}

<script>
// Request queuing system to prevent ESP32 crash due to concurrent socket exhaustion
const requestQueue = [];
let queueProcessing = false;

function safeFetch(url, options = {}, isStatusPoll = false) {
    return new Promise((resolve, reject) => {
        if (isStatusPoll && requestQueue.some(item => item.isStatusPoll)) {
            resolve({ ok: true, json: () => Promise.resolve({}) });
            return;
        }
        requestQueue.push({ url, options, resolve, reject, isStatusPoll });
        processRequestQueue();
    });
}

function processRequestQueue() {
    if (queueProcessing || requestQueue.length === 0) return;
    queueProcessing = true;

    const { url, options, resolve, reject, isStatusPoll } = requestQueue.shift();
    if (!isStatusPoll) {
        document.body.classList.add('sending-command');
    }

    fetch(url, options)
        .then(res => {
            resolve(res);
        })
        .catch(err => {
            reject(err);
        })
        .finally(() => {
            queueProcessing = false;
            const hasMoreCommands = requestQueue.some(item => !item.isStatusPoll);
            if (!hasMoreCommands) {
                document.body.classList.remove('sending-command');
            }
            setTimeout(processRequestQueue, 150);
        });
}

function pad(num) {
    return num.toString().padStart(2, '0');
}

function initDateTime() {
    return new Promise((resolve) => {
        let localTime = null;

        async function updateClock() {
            try {
                const res = await safeFetch('/api/time', {}, true);
                const data = await res.json();

                // Month is 1-based in RTC, but 0-based in JS Date
                localTime = new Date(data.year, data.month - 1, data.day, data.hour, data.minute, data.second);
                renderClock();
                resolve();
            } catch (e) {
                document.getElementById('currentDateTime').innerHTML = 'Time unavailable';
                resolve(); // resolve anyway to not block initialization
            }
        }

        function renderClock() {
            if (!localTime) return;
            let hour = localTime.getHours();
            const minute = pad(localTime.getMinutes());
            const second = pad(localTime.getSeconds());
            const ampm = hour >= 12 ? 'PM' : 'AM';

            hour = hour % 12;
            hour = hour ? hour : 12; // convert 0 to 12

            const formatted = `${pad(localTime.getMonth() + 1)}/${pad(localTime.getDate())}/${localTime.getFullYear()} ` +
                              `${pad(hour)}:${minute}:${second} ${ampm}`;

            document.getElementById('currentDateTime').innerHTML = formatted;
        }

        updateClock();

        // Increment clock locally every second
        setInterval(() => {
            if (localTime) {
                localTime.setTime(localTime.getTime() + 1000);
                renderClock();
            }
        }, 1000);

        // Periodically refresh from server (e.g. every 60 seconds) to prevent drift
        setInterval(updateClock, 60000);
    });
}

function formatTime24To12(time24) {
    if (!time24 || typeof time24 !== 'string') return "Not set";
    const parts = time24.split(':');
    if (parts.length < 2) return time24;
    const [hours, minutes] = parts;
    const hoursNum = parseInt(hours);
    if (isNaN(hoursNum)) return time24;
    const hours12 = ((hoursNum % 12) || 12);
    const amPm = hoursNum >= 12 ? 'PM' : 'AM';
    return `${hours12}:${minutes} ${amPm}`;
}

function toggleDayBadge(element) {
    element.classList.toggle('active');
}

let currentSettings = null;
let currentSchedules = null;

function timeToMins(t) {
    if (!t) return 0;
    const [h, m] = t.split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
}

const DAYS_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
function getNextDay(day) {
    const idx = DAYS_ORDER.indexOf(day);
    return DAYS_ORDER[(idx + 1) % 7];
}

function expandSchedule(sched) {
    const intervals = [];
    const start = timeToMins(sched.onTime);
    const end = timeToMins(sched.offTime);
    const days = sched.days || [];
    
    days.forEach(day => {
        if (start < end) {
            intervals.push({ day, start, end });
        } else {
            // crosses midnight
            intervals.push({ day, start, end: 1440 });
            intervals.push({ day: getNextDay(day), start: 0, end });
        }
    });
    return intervals;
}

function checkOverlap(int1, int2) {
    if (int1.day !== int2.day) return false;
    return Math.max(int1.start, int2.start) < Math.min(int1.end, int2.end);
}

async function init() {
    await initDateTime();
    await fetchSchedules();
}

async function fetchSchedules() {
    try {
        const settingsRes = await safeFetch('/get-settings');
        const settings = await settingsRes.json();

        const schedulesRes = await safeFetch('/get-schedules');
        const data = await schedulesRes.json();

        currentSettings = settings;
        currentSchedules = data;
        const zoneNames = (settings && settings.zone_names) || [];
        const masterValve = (settings && settings.master_valve !== undefined) ? parseInt(settings.master_valve) : -1;
        const container = document.getElementById('zonesContainer');
        container.innerHTML = '';

        if (!Array.isArray(data)) {
            console.error("Schedules data is not an array:", data);
            container.innerHTML = '<div style="color: var(--accent-red); font-weight: bold; padding: 20px;">Error loading schedules: invalid response format.</div>';
            return;
        }

        data.forEach((zoneConfig, index) => {
            const zoneNum = index + 1;
            const defaultName = `Zone ${zoneNum}`;
            const zoneName = zoneNames[index] || defaultName;
            
            const isZoneEnabled = zoneConfig ? zoneConfig.enabled : false;
            const schedulesList = (zoneConfig && zoneConfig.schedules) || [];

            const card = document.createElement('div');
            card.className = 'zone-card';

            if (index === masterValve) {
                // Render disabled view for master valve
                card.innerHTML = `
                    <div class="zone-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                        <h2 class="zone-title">${zoneName} (Master Valve)</h2>
                    </div>
                    <div style="margin-top: 15px; color: var(--accent-amber); font-weight: 600; font-style: italic; font-size: 0.9rem;">
                        Schedules are disabled for this zone because it is configured as the Master Valve.
                    </div>
                `;
                container.appendChild(card);
                return;
            }

            // Zone Header
            let headerHTML = `
                <div class="zone-header">
                    <h2 class="zone-title">${zoneName}</h2>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.85rem; color: var(--text-secondary)">Active:</span>
                        <label class="switch">
                            <input type="checkbox" onchange="toggleZoneSchedule(${index}, this)" ${isZoneEnabled ? 'checked' : ''}>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            `;

            // Schedules List
            let schedulesHTML = '<div class="schedules-list">';
            if (schedulesList.length === 0) {
                schedulesHTML += '<div class="no-schedules">No schedules configured for this zone.</div>';
            } else {
                schedulesList.forEach((sched) => {
                    if (!sched) return;
                    const days = Array.isArray(sched.days) ? sched.days : [];
                    const daysStr = days.map(d => `<span class="day-badge-small">${d}</span>`).join(' ');
                    schedulesHTML += `
                        <div class="schedule-item">
                            <div class="schedule-details">
                                <div class="schedule-days">${daysStr}</div>
                                <div class="schedule-time">${formatTime24To12(sched.onTime)} - ${formatTime24To12(sched.offTime)}</div>
                            </div>
                            <div class="schedule-actions">
                                <label class="switch" style="width: 40px; height: 22px;">
                                    <input type="checkbox" onchange="toggleScheduleItem(${index}, '${sched.id || ''}', this)" ${sched.enabled ? 'checked' : ''}>
                                    <span class="slider" style="border-radius: 24px;"></span>
                                </label>
                                <button class="btn" style="background-color: var(--accent-blue); color: white; padding: 6px 12px; font-size: 0.8rem;" onclick="editScheduleItem(${index}, '${sched.id || ''}')">Edit</button>
                                <button class="btn btn-danger" onclick="deleteScheduleItem(${index}, '${sched.id || ''}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
            }
            schedulesHTML += '</div>';

            // Add Schedule Form
            let formHTML = `
                <div class="add-schedule-form">
                    <div class="form-title">Add New Schedule</div>
                    <div class="day-selector" id="days-zone-${index}">
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Mon">M</span>
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Tue">T</span>
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Wed">W</span>
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Thu">T</span>
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Fri">F</span>
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Sat">S</span>
                        <span class="day-badge" onclick="toggleDayBadge(this)" data-day="Sun">S</span>
                    </div>
                    <div class="time-selector">
                        <div class="time-input-group">
                            <label>Start Time</label>
                            <input type="time" id="onTime-zone-${index}">
                        </div>
                        <div class="time-input-group">
                            <label>End Time</label>
                            <input type="time" id="offTime-zone-${index}">
                        </div>
                    </div>
                    <button class="btn btn-add" id="action-btn-zone-${index}" onclick="addScheduleItem(${index})">Add Schedule</button>
                </div>
            `;

            card.innerHTML = headerHTML + schedulesHTML + formHTML;
            container.appendChild(card);
        });
    } catch (error) {
        console.error("Error fetching schedules:", error);
    }
}

function toggleZoneSchedule(zoneIndex, element) {
    const isEnabled = element.checked;
    safeFetch(`/toggle-schedule/${zoneIndex}/${isEnabled}`)
    .then(response => {
        if (response.ok) {
            fetchSchedules();
        } else {
            alert("Failed to toggle zone schedule");
            element.checked = !isEnabled;
        }
    })
    .catch(err => {
        console.error("Error toggling zone schedule:", err);
        element.checked = !isEnabled;
    });
}

function toggleScheduleItem(zoneIndex, schedId, element) {
    const isEnabled = element.checked;
    safeFetch(`/toggle-schedule-item/${zoneIndex}/${schedId}/${isEnabled}`, { method: 'POST' })
    .then(response => {
        if (response.ok) {
            fetchSchedules();
        } else {
            alert("Failed to toggle schedule item");
            element.checked = !isEnabled;
        }
    })
    .catch(err => {
        console.error("Error toggling schedule item:", err);
        element.checked = !isEnabled;
    });
}

function deleteScheduleItem(zoneIndex, schedId) {
    if (confirm("Are you sure you want to delete this schedule?")) {
        safeFetch(`/delete-schedule/${zoneIndex}/${schedId}`, { method: 'POST' })
        .then(response => {
            if (response.ok) {
                fetchSchedules();
            } else {
                alert("Failed to delete schedule");
            }
        })
        .catch(err => {
            console.error("Error deleting schedule item:", err);
        });
    }
}

function addScheduleItem(zoneIndex) {
    const daysContainer = document.getElementById(`days-zone-${zoneIndex}`);
    const activeBadges = daysContainer.querySelectorAll('.day-badge.active');
    const days = Array.from(activeBadges).map(b => b.getAttribute('data-day'));
    
    const onTime = document.getElementById(`onTime-zone-${zoneIndex}`).value;
    const offTime = document.getElementById(`offTime-zone-${zoneIndex}`).value;

    if (days.length === 0) {
        alert("Please select at least one day.");
        return;
    }
    if (!onTime || !offTime) {
        alert("Please set both turn-on and turn-off times.");
        return;
    }

    // 1. Duration check
    const startMins = timeToMins(onTime);
    const endMins = timeToMins(offTime);
    let durationMinutes = 0;
    if (startMins < endMins) {
        durationMinutes = endMins - startMins;
    } else {
        durationMinutes = (1440 - startMins) + endMins;
    }

    if (durationMinutes > 60) {
        const hrs = Math.floor(durationMinutes / 60);
        const mins = durationMinutes % 60;
        const durationStr = mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`;
        const confirmMsg = `Warning: The selected schedule runs for more than an hour (${durationStr}). Running sprinklers for this long can over-water or waste resources.\n\nDo you still want to save it?`;
        if (!confirm(confirmMsg)) {
            return; // Abort
        }
    }

    const isEditing = !!editingSchedIds[zoneIndex];

    // 2. Overlap check
    const candidateSched = { days, onTime, offTime };
    const candidateIntervals = expandSchedule(candidateSched);
    let overlappingZone = null;
    let overlappingSched = null;

    if (currentSchedules && currentSettings) {
        const zoneNames = currentSettings.zone_names || [];
        currentSchedules.forEach((zoneConfig, zIdx) => {
            const zName = zoneNames[zIdx] || `Zone ${zIdx + 1}`;
            const sList = zoneConfig.schedules || [];
            sList.forEach(sched => {
                if (!sched || !sched.enabled) return;
                if (isEditing && sched.id === editingSchedIds[zoneIndex]) return; // Skip overlap check against itself
                const existingIntervals = expandSchedule(sched);
                existingIntervals.forEach(eInt => {
                    candidateIntervals.forEach(cInt => {
                        if (checkOverlap(eInt, cInt)) {
                            overlappingZone = zName;
                            overlappingSched = sched;
                        }
                    });
                });
            });
        });
    }

    if (overlappingZone && overlappingSched) {
        const confirmMsg = `Warning: This schedule overlaps with an active schedule in ${overlappingZone} (${overlappingSched.days.join(', ')} from ${formatTime24To12(overlappingSched.onTime)} to ${formatTime24To12(overlappingSched.offTime)}).\n\nDo you still want to save it?`;
        if (!confirm(confirmMsg)) {
            return; // Abort
        }
    }

    const url = isEditing ? `/edit-schedule/${zoneIndex}/${editingSchedIds[zoneIndex]}` : `/add-schedule/${zoneIndex}`;

    const payload = {
        days: days,
        onTime: onTime,
        offTime: offTime
    };

    safeFetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (response.ok) {
            if (isEditing) {
                delete editingSchedIds[zoneIndex];
                const cancelBtn = document.getElementById(`cancel-edit-zone-${zoneIndex}`);
                if (cancelBtn) cancelBtn.remove();
            }
            // Reset fields
            document.getElementById(`onTime-zone-${zoneIndex}`).value = '';
            document.getElementById(`offTime-zone-${zoneIndex}`).value = '';
            daysContainer.querySelectorAll('.day-badge.active').forEach(b => b.classList.remove('active'));
            fetchSchedules();
        } else {
            alert(isEditing ? "Failed to update schedule" : "Failed to add schedule");
        }
    })
    .catch(err => {
        console.error("Error saving schedule:", err);
    });
}

let editingSchedIds = {};

function editScheduleItem(zoneIndex, schedId) {
    if (!currentSchedules) return;
    const zoneConfig = currentSchedules[zoneIndex];
    if (!zoneConfig) return;
    const sched = zoneConfig.schedules.find(s => s.id === schedId);
    if (!sched) return;

    editingSchedIds[zoneIndex] = schedId;

    // Reset and set active badges
    const daysContainer = document.getElementById(`days-zone-${zoneIndex}`);
    daysContainer.querySelectorAll('.day-badge').forEach(b => {
        const day = b.getAttribute('data-day');
        if (sched.days && sched.days.includes(day)) {
            b.classList.add('active');
        } else {
            b.classList.remove('active');
        }
    });

    // Set time inputs
    document.getElementById(`onTime-zone-${zoneIndex}`).value = sched.onTime || '';
    document.getElementById(`offTime-zone-${zoneIndex}`).value = sched.offTime || '';

    // Change button text and style
    const btn = document.getElementById(`action-btn-zone-${zoneIndex}`);
    btn.innerText = "Update Schedule";
    
    // Add a Cancel Edit button if not present
    let cancelBtn = document.getElementById(`cancel-edit-zone-${zoneIndex}`);
    if (!cancelBtn) {
        cancelBtn = document.createElement('button');
        cancelBtn.id = `cancel-edit-zone-${zoneIndex}`;
        cancelBtn.className = "btn";
        cancelBtn.style.backgroundColor = "#475569";
        cancelBtn.style.color = "white";
        cancelBtn.style.padding = "10px 16px";
        cancelBtn.style.fontSize = "0.9rem";
        cancelBtn.style.width = "100%";
        cancelBtn.style.marginTop = "8px";
        cancelBtn.innerText = "Cancel Edit";
        cancelBtn.onclick = () => cancelEdit(zoneIndex);
        btn.parentNode.appendChild(cancelBtn);
    }
}

function cancelEdit(zoneIndex) {
    delete editingSchedIds[zoneIndex];
    
    // Reset fields
    const daysContainer = document.getElementById(`days-zone-${zoneIndex}`);
    daysContainer.querySelectorAll('.day-badge').forEach(b => b.classList.remove('active'));
    document.getElementById(`onTime-zone-${zoneIndex}`).value = '';
    document.getElementById(`offTime-zone-${zoneIndex}`).value = '';

    const btn = document.getElementById(`action-btn-zone-${zoneIndex}`);
    btn.innerText = "Add Schedule";

    const cancelBtn = document.getElementById(`cancel-edit-zone-${zoneIndex}`);
    if (cancelBtn) {
        cancelBtn.remove();
    }
}
</script>
