<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Intellidwell Sprinkler Controller</title>
<style>
:root {
  --bg-color: #0b0f19;
  --card-bg: rgba(30, 41, 59, 0.7);
  --card-active-bg: rgba(30, 41, 59, 0.9);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --accent-blue: #3b82f6;
  --accent-emerald: #10b981;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
}

body {
  background-color: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 15px 15px 90px 15px; /* bottom padding for tab bar */
  min-height: 100vh;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 600px;
}

/* Header & Status */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  margin-bottom: 20px;
}

.title-section {
  display: flex;
  flex-direction: column;
}

.title-section h1 {
  margin: 0;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 4px;
}

.status-dot {
  width: 8px;
  height: 8px;
  background-color: var(--accent-emerald);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-emerald);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

/* Zone Card */
.zone-card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.zone-card.active {
  background: var(--card-active-bg);
  border-color: rgba(59, 130, 246, 0.3);
  box-shadow: 0 10px 25px rgba(59, 130, 246, 0.15);
}

.zone-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.zone-info {
  display: flex;
  align-items: center;
  gap: 14px;
}

.sprinkler-icon-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  background-color: rgba(255, 255, 255, 0.04);
  border-radius: 12px;
  color: var(--text-secondary);
  transition: all 0.3s;
}

.zone-card.active .sprinkler-icon-wrapper {
  background-color: rgba(59, 130, 246, 0.15);
  color: var(--accent-blue);
  animation: spray 1.5s ease-in-out infinite alternate;
}

@keyframes spray {
  0% { transform: rotate(-5deg); }
  100% { transform: rotate(5deg); }
}

.zone-details {
  display: flex;
  flex-direction: column;
}

.zone-name {
  font-weight: 700;
  font-size: 1.1rem;
}

.zone-status-text {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.zone-card.active .zone-status-text {
  color: var(--accent-blue);
  font-weight: 600;
}

/* Switches */
.switch {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 30px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #334155;
  transition: .25s;
  border-radius: 30px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 22px;
  width: 22px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .25s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--accent-blue);
}

input:checked + .slider:before {
  transform: translateX(22px);
}

/* Collapsible Quick Timer Section */
.zone-timer-section {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease-out;
  border-top: 1px solid transparent;
  margin-top: 0;
  padding-top: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.zone-card.show-timer .zone-timer-section {
  max-height: 120px;
  border-top: 1px solid var(--border-color);
  margin-top: 12px;
  padding-top: 12px;
}

.timer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.presets-container {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.preset-btn {
  background-color: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.preset-btn.selected {
  background-color: rgba(59, 130, 246, 0.2);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.custom-timer-input {
  display: flex;
  align-items: center;
  background-color: rgba(0, 0, 0, 0.2);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 2px 6px;
  width: 90px;
}

.custom-timer-input input {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  text-align: center;
  font-size: 0.95rem;
  font-weight: bold;
  outline: none;
}

.btn {
  border: none;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.btn-start {
  background-color: var(--accent-blue);
  color: white;
  padding: 8px 16px;
  font-size: 0.9rem;
}

.btn-cancel {
  background-color: var(--accent-red);
  color: white;
  padding: 8px 16px;
  font-size: 0.9rem;
}

/* Rain Delay Panel */
.rain-delay-card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rain-delay-card select {
  font-weight: 600;
}

.rain-delay-header {
  font-weight: 700;
  font-size: 1rem;
  color: var(--text-secondary);
}

.rain-delay-selector-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

select {
  flex: 1;
  background-color: rgba(0,0,0,0.3);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 10px;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
}

/* Navigation Sticky Tab Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background-color: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 600;
  background: none;
  border: none;
  padding: 8px 0;
  flex: 1;
  transition: color 0.2s;
  cursor: pointer;
}

.nav-item.active {
  color: var(--accent-blue);
}

.nav-icon {
  width: 22px;
  height: 22px;
  margin-bottom: 4px;
  fill: currentColor;
}

.countdown-badge {
  background: var(--accent-amber);
  color: #000;
  font-size: 0.8rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 20px;
}

.btn-trigger-timer {
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background-color 0.2s;
}

.btn-trigger-timer:hover {
  background-color: rgba(255, 255, 255, 0.05);
}

.zone-card.show-timer .btn-trigger-timer {
  color: var(--accent-blue);
  background-color: rgba(59, 130, 246, 0.1);
}

body.sending-command #zonesContainer,
body.sending-command .rain-delay-card {
  pointer-events: none;
  opacity: 0.6;
  transition: opacity 0.15s ease-in-out;
}

body.sending-command .status-dot {
  background-color: var(--accent-amber) !important;
  box-shadow: 0 0 8px var(--accent-amber) !important;
}

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-section">
      <h1>Intellidwell Sprinkler Controller</h1>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>Controller Online</span>
      </div>
    </div>
  </div>

  <!-- Dynamic Zone Cards list -->
  <div id="zonesContainer">
    <!-- Rendered dynamically -->
  </div>

  <div class="rain-delay-card">

        <option value="1">Delay 1 Day</option>
        <option value="2">Delay 2 Days</option>
        <option value="3">Delay 3 Days</option>
        <option value="4">Delay 4 Days</option>
        <option value="5">Delay 5 Days</option>
      </select>
      <button class="btn btn-start" style="padding: 10px 20px;" onclick="confirmRainDelay()">Set Delay</button>
    </div>
    <div id="rainDelayStatus" style="font-weight: bold; color: var(--accent-emerald); display: none;"></div>

  <!-- Sequential Runs Panel -->

    <div id="sequentialRunsList" style="display: flex; flex-direction: column; gap: 10px;">
      <!-- Populated dynamically -->

    <!-- Stop button shown globally if a sequential run is active -->
    <button class="btn btn-danger" style="display: none; width: 100%; padding: 12px; margin-top: 10px; background-color: var(--accent-red); color: white;" onclick="stopRunQueue()" id="stopQueueBtn">Stop Runs</button>
    
    <!-- Active status display -->
    <div id="runQueueActiveStatus" style="display: none; padding: 10px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-emerald); border-radius: 8px; margin-top: 10px;">
      <div style="font-weight: bold; color: var(--accent-emerald);" id="currentRunningStatusText">Zone 1 Running...</div>
      <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;" id="queueProgressText">Remaining zones in queue: 2</div>
    </div>
  </div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
  <a href="/" class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    Dashboard
  </a>
  <a href="/scheduler" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
    </svg>

    </svg>
    Logs

  <a href="/settings" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
    Settings

<script>
// Request queuing system to prevent ESP32 crash due to concurrent socket exhaustion
const requestQueue = [];
let queueProcessing = false;

function safeFetch(url, options = {}, isStatusPoll = false) {
    return new Promise((resolve, reject) => {
        if (isStatusPoll && requestQueue.some(item => item.isStatusPoll)) {
            resolve({ ok: true, json: () => Promise.resolve({}) });
            return;
        }
        requestQueue.push({ url, options, resolve, reject, isStatusPoll });
        processRequestQueue();
    });
}

function processRequestQueue() {
    if (queueProcessing || requestQueue.length === 0) return;
    queueProcessing = true;

    const { url, options, resolve, reject, isStatusPoll } = requestQueue.shift();
    if (!isStatusPoll) {
        document.body.classList.add('sending-command');
    }

    fetch(url, options)
        .then(res => {
            resolve(res);
        })
        .catch(err => {
            reject(err);
        })
        .finally(() => {
            queueProcessing = false;
            const hasMoreCommands = requestQueue.some(item => !item.isStatusPoll);
            if (!hasMoreCommands) {
                document.body.classList.remove('sending-command');
            }
            setTimeout(processRequestQueue, 150);
        });
}

// Dynamically build zone rows
document.addEventListener("DOMContentLoaded", () => {
    Promise.all([
        safeFetch('/get-settings').then(res => res.json()),
        safeFetch('/get-rain-delay').then(res => res.json())
    ]).then(([settings, rainDelayData]) => {
        const zoneNames = settings.zone_names || [];
        populateSequentialRunsList(settings);
        const container = document.getElementById("zonesContainer");
        container.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const defaultName = `Zone ${i + 1}`;
            const zoneName = zoneNames[i] || defaultName;
            const card = document.createElement("div");
            card.className = "zone-card";
            card.id = `zone-card-${i}`;
            card.innerHTML = `
                <div class="zone-main">
                    <div class="zone-info">
                        <div class="sprinkler-icon-wrapper">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-13-7-13S5 10.7 5 15a7 7 0 0 0 7 7z"/>
                            </svg>
                        </div>
                        <div class="zone-details">
                            <span class="zone-name">${zoneName}</span>
                            <span class="zone-status-text" id="zone${i}-status-text">Ready</span>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="countdown-badge" id="zone${i}-countdown" style="display: none;"></span>
                        <button class="btn-trigger-timer" onclick="toggleTimerSection(${i})">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </button>
                        <label class="switch">
                            <input type="checkbox" onchange="toggleRelay(this, ${i})" data-index="${i}">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                
                <div class="zone-timer-section" id="zone${i}-timer-section">
                    <div class="timer-row">
                        <div class="presets-container" id="zone${i}-presets">
                            <button class="preset-btn selected" onclick="selectPreset(${i}, 5, this)">5m</button>
                            <button class="preset-btn" onclick="selectPreset(${i}, 10, this)">10m</button>
                            <button class="preset-btn" onclick="selectPreset(${i}, 15, this)">15m</button>
                            <button class="preset-btn" onclick="selectPreset(${i}, 30, this)">30m</button>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <div class="custom-timer-input" id="zone${i}-custom-input-wrap">
                                <input type="number" id="zone${i}-custom-min" value="5" min="1" max="120" onchange="syncCustomVal(${i})">
                                <span style="font-size: 0.8rem; color: var(--text-secondary); margin-right: 4px;">min</span>
                            </div>
                            <button class="btn btn-start" id="zone${i}-start-btn" onclick="startTimer(${i})">Start</button>
                            <button class="btn btn-danger" id="zone${i}-cancel" style="display:none;" onclick="cancelTimer(${i})">Cancel</button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }
        
        // Populate rain delay state
        const days = rainDelayData.days_remaining;
        const statusEl = document.getElementById("rainDelayStatus");
        if (days > 0) {
            statusEl.innerText = `Rain delay active: ${days} day${days > 1 ? 's' : ''} remaining`;
            statusEl.style.display = "block";
            document.getElementById("rainDelay").value = days;
        } else {
            statusEl.style.display = "none";
            document.getElementById("rainDelay").value = 0;
        }
        pollStatus();
        setInterval(pollStatus, 1000);
    }).catch(err => {
        console.error("Initialization failed:", err);
    });
});

function toggleTimerSection(zone) {
    const card = document.getElementById(`zone-card-${zone}`);
    card.classList.toggle('show-timer');
}

function selectPreset(zone, minutes, element) {
    const container = element.parentElement;
    container.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('selected'));
    element.classList.add('selected');
    document.getElementById(`zone${zone}-custom-min`).value = minutes;
}

function syncCustomVal(zone) {
    const customVal = parseInt(document.getElementById(`zone${zone}-custom-min`).value);
    const presets = document.getElementById(`zone-card-${zone}`).querySelectorAll('.preset-btn');
    presets.forEach(btn => {
        const min = parseInt(btn.innerText);
        if (min === customVal) {
            btn.classList.add('selected');
        } else {
            btn.classList.remove('selected');
        }
    });
}

function pollStatus() {
    safeFetch('/api/status', {}, true)
    .then(res => {
        if (!res.ok) throw new Error("Status endpoint failed");
        return res.json();
    })
    .then(data => {
        // 1. Update Relay Switches and Countdown Badges
        const states = data.relay_states || [];
        states.forEach((state, index) => {
            const switchElement = document.querySelector(`input[type="checkbox"][data-index="${index}"]`);
            if (switchElement) {
                const currentState = (state === 1);
                if (switchElement.checked !== currentState) {
                    switchElement.checked = currentState;
                }
                const card = document.getElementById(`zone-card-${index}`);
                const statusText = document.getElementById(`zone${index}-status-text`);
                const countdownEl = document.getElementById(`zone${index}-countdown`);
                const cancelBtn = document.getElementById(`zone${index}-cancel`);
                const startBtn = document.getElementById(`zone${index}-start-btn`);
                
                if (data.timers && data.timers.hasOwnProperty(index)) {
                    const seconds = data.timers[index];
                    const min = Math.floor(seconds / 60);
                    const sec = seconds % 60;
                    if (countdownEl) {
                        countdownEl.innerText = `${min}:${sec.toString().padStart(2, '0')}`;
                        countdownEl.style.display = "inline-block";
                    }
                    const presetsEl = document.getElementById(`zone${index}-presets`);
                    if (presetsEl) presetsEl.style.display = "none";
                    const inputWrapEl = document.getElementById(`zone${index}-custom-input-wrap`);
                    if (inputWrapEl) inputWrapEl.style.display = "none";
                    if (cancelBtn) cancelBtn.style.display = "inline-block";
                    if (startBtn) startBtn.style.display = "none";
                    if (card) {
                        card.classList.add('active');
                    }
                    if (statusText) statusText.innerText = `Irrigating (Timer: ${min}:${sec.toString().padStart(2, '0')})`;
                } else {
                    if (countdownEl) {
                        countdownEl.style.display = "none";
                        countdownEl.innerText = "";
                    }
                    const presetsEl = document.getElementById(`zone${index}-presets`);
                    if (presetsEl) presetsEl.style.display = "flex";
                    const inputWrapEl = document.getElementById(`zone${index}-custom-input-wrap`);
                    if (inputWrapEl) inputWrapEl.style.display = "flex";
                    if (cancelBtn) cancelBtn.style.display = "none";
                    if (startBtn) startBtn.style.display = "inline-block";
                    if (card) {
                        card.classList.remove('active');
                    }
                    if (statusText) {
                        if (currentState) {
                            if (card) card.classList.add('active');
                            statusText.innerText = 'Sprinkling Active';
                        } else {
                            statusText.innerText = 'Ready';
                        }
                    }
                }
            }
        });

        // 2. Update Run Queue Status
        const q = data.queue;
        const statusEl = document.getElementById("runQueueActiveStatus");
        const stopBtn = document.getElementById("stopQueueBtn");
        const runBtns = document.querySelectorAll("#sequentialRunsList button");
        
        if (q && q.active) {
            runBtns.forEach(btn => btn.disabled = true);
            if (stopBtn) stopBtn.style.display = "inline-block";
            if (statusEl) statusEl.style.display = "block";
            
            const currItem = q.steps[q.current_index];
            if (currItem) {
                const names = (globalSettings && globalSettings.zone_names) || [];
                const zoneName = names[currItem.pin] || `Zone ${currItem.pin + 1}`;
                const min = Math.floor(q.remaining_seconds / 60);
                const sec = q.remaining_seconds % 60;
                const timeStr = `${min}:${sec.toString().padStart(2, '0')}`;
                
                document.getElementById("currentRunningStatusText").innerText = `Active Run: ${zoneName} (${timeStr} remaining)`;
                
                const remainingZones = q.steps.slice(q.current_index + 1);
                if (remainingZones.length > 0) {
                    const remainingNames = remainingZones.map(item => names[item.pin] || `Zone ${item.pin + 1}`).join(', ');
                    document.getElementById("queueProgressText").innerText = `Next in queue: ${remainingNames}`;
                } else {
                    document.getElementById("queueProgressText").innerText = `This is the last zone in the queue.`;
                }
            }
        } else {
            runBtns.forEach(btn => btn.disabled = false);
            if (stopBtn) stopBtn.style.display = "none";
            if (statusEl) statusEl.style.display = "none";
        }
    })
    .catch(error => {
        console.error('Failed to poll status:', error);
    });
}

function toggleRelay(element, pin) {
    const state = element.checked ? 'on' : 'off';
    safeFetch(`/relay/${pin}/${state}`)
        .then(response => response.text())
        .then(data => {
            console.log(data);
            pollStatus();
        });
}

function restartDevice() {
    if (confirm("Are you sure you want to restart the controller?")) {
        safeFetch('/restart', { method: 'POST' })
        .then(response => response.text())
        .then(data => {
            alert("Restarting device...");
        })
        .catch(error => console.error('Error restarting device:', error));
    }
}

// Keep rain delay settings and updates in sync
function confirmRainDelay() {
    const days = parseInt(document.getElementById("rainDelay").value);
    safeFetch(`/set-rain-delay/${days}`)
        .then(res => res.text())
        .then(data => {
            updateRainDelayStatus();
        })
        .catch(err => alert("Failed to set rain delay."));
}

function updateRainDelayStatus() {
    safeFetch('/get-rain-delay')
        .then(res => res.json())
        .then(data => {
            const days = data.days_remaining;
            const statusEl = document.getElementById("rainDelayStatus");

            if (days > 0) {
                statusEl.innerText = `Rain delay active: ${days} day${days > 1 ? 's' : ''} remaining`;
                statusEl.style.display = "block";
                document.getElementById("rainDelay").value = days;
            } else {
                statusEl.style.display = "none";
                document.getElementById("rainDelay").value = 0;
            }
        })
        .catch(err => {
            console.error("Failed to update rain delay status:", err);
        });
}

function startTimer(zone) {
    const minutes = parseInt(document.getElementById(`zone${zone}-custom-min`).value);
    if (isNaN(minutes) || minutes <= 0) {
        alert("Enter a valid number of minutes");
        return;
    }
    safeFetch(`/relay-timer/${zone}/${minutes}`)
        .then(res => {
            if (!res.ok) throw new Error("Timer failed to start");
            pollStatus();
        })
        .catch(err => {
            alert("Failed to start timer");
        });
}

function cancelTimer(zone) {
    safeFetch(`/cancel-timer/${zone}`)
        .then(() => {
            const card = document.getElementById(`zone-card-${zone}`);
            if (card) card.classList.remove('show-timer');
            pollStatus();
        });
}

let globalSettings = null;

function populateSequentialRunsList(settings) {
    globalSettings = settings;
    const listEl = document.getElementById("sequentialRunsList");
    listEl.innerHTML = '';
    
    const runs = settings.sequential_runs || [];
    if (runs.length === 0) {
        listEl.innerHTML = '<div style="color: var(--text-secondary); font-style: italic; font-size: 0.85rem;">No sequential runs configured. Go to Settings to add one.</div>';
        return;
    }
    
    runs.forEach((run, runIdx) => {
        const runName = run.name || `Run ${runIdx + 1}`;
        
        const zoneNames = settings.zone_names || [];
        const stepStrings = (run.steps || []).map(step => {
            const name = zoneNames[step.pin] || `Zone ${step.pin + 1}`;
            return `${name} (${step.duration_mins}m)`;
        });
        const summaryText = stepStrings.join(" → ") || "No steps";
        
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.justifyContent = "space-between";
        row.style.alignItems = "center";
        row.style.padding = "10px 14px";
        row.style.background = "rgba(255,255,255,0.03)";
        row.style.borderRadius = "10px";
        row.style.border = "1px solid var(--border-color)";
        row.style.gap = "12px";
        
        row.innerHTML = `
            <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary);">${runName}</span>
                <span style="font-size: 0.75rem; color: var(--text-secondary); line-height: 1.2;">${summaryText}</span>
            </div>
            <button class="btn btn-start" style="padding: 8px 16px; font-size: 0.85rem; width: auto; margin: 0; min-width: 60px;" onclick="triggerSequentialRun(${runIdx})" id="run-btn-${runIdx}">Run</button>
        `;
        listEl.appendChild(row);
    });
}

function triggerSequentialRun(runIdx) {
    if (!globalSettings || !globalSettings.sequential_runs || !globalSettings.sequential_runs[runIdx]) {
        alert("Sequential run configuration not loaded.");
        return;
    }
    
    const run = globalSettings.sequential_runs[runIdx];
    const steps = run.steps || [];
    if (steps.length === 0) {
        alert("This sequential run has no steps configured.");
        return;
    }
    
    safeFetch('/start-run-queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ queue: steps })
    })
    .then(res => {
        if (res.ok) {
            pollStatus();
        } else {
            alert("Failed to start sequential run.");
        }
    })
    .catch(err => console.error("Error starting sequential run:", err));
}

function stopRunQueue() {
    safeFetch('/stop-run-queue', { method: 'POST' })
    .then(res => {
        if (res.ok) {
            pollStatus();
        }
    })
    .catch(err => console.error("Error stopping run queue:", err));
}
</script>
