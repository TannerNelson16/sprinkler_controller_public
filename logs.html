<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Logs - Sprinkler Controller</title>
<style>
:root {
  --bg-color: #0b0f19;
  --card-bg: rgba(30, 41, 59, 0.7);
  --border-color: rgba(255, 255, 255, 0.08);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --accent-blue: #3b82f6;
  --accent-emerald: #10b981;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
}

body {
  background-color: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 15px 15px 90px 15px; /* bottom padding for tab bar */
  min-height: 100vh;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 600px;
}

h1 {
  margin: 10px 0 20px 0;
  font-size: 1.6rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.log-area {
  width: 100%;
  height: 400px;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  overflow-y: auto;
  margin-bottom: 20px;
  padding: 15px;
  background-color: rgba(0, 0, 0, 0.3);
  color: #e2e8f0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.85rem;
  line-height: 1.5;
  white-space: pre-line;
  box-sizing: border-box;
}

/* Button styling */
.btn {
  background-color: var(--accent-red);
  border: none;
  color: white;
  padding: 12px 20px;
  font-size: 0.95rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  transition: background-color 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:hover {
  background-color: #dc2626;
}

/* Navigation Sticky Tab Bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background-color: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 1000;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 600;
  background: none;
  border: none;
  padding: 8px 0;
  flex: 1;
  transition: color 0.2s;
  cursor: pointer;
}

.nav-item.active {
  color: var(--accent-blue);
}

.nav-icon {
  width: 22px;
  height: 22px;
  margin-bottom: 4px;
  fill: currentColor;
}

</style>
</head>
<body>
<div class="container">
  <h1>System Logs</h1>

  <div class="card">
    <div class="log-area" id="logArea">Loading logs...</div>
    <button class="btn" id="clearButton" onclick="clearLogs()">Clear Logs</button>
  </div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
  <a href="/" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    Dashboard
  </a>
  <a href="/scheduler" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
    </svg>
    Scheduler
  </a>
  <a href="/logs-page" class="nav-item active">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
    </svg>
    Logs
  </a>
  <a href="/settings" class="nav-item">
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
    Settings
  </a>
</div>

<script>
function fetchLogs() {
    fetch('/get-logs')
        .then(response => response.text())
        .then(data => {
            const logArea = document.getElementById('logArea');
            if (data.trim() === '') {
                logArea.innerHTML = '<span style="color: var(--text-secondary); font-style: italic;">No log entries found.</span>';
            } else {
                logArea.innerHTML = data.replace(/\n/g, '<br>');
            }
            logArea.scrollTop = logArea.scrollHeight; // Scroll to the bottom
        })
        .catch(err => {
            document.getElementById('logArea').innerText = 'Failed to fetch logs.';
            console.error('Error fetching logs:', err);
        });
}

function clearLogs() {
    if (confirm("Are you sure you want to clear the logs?")) {
        fetch('/clear-logs', { method: 'POST' })
            .then(response => response.text())
            .then(data => {
                document.getElementById('logArea').innerHTML = '<span style="color: var(--text-secondary); font-style: italic;">Logs cleared.</span>';
                alert(data);
            })
            .catch(err => {
                alert('Failed to clear logs.');
                console.error('Error clearing logs:', err);
            });
    }
}

window.onload = function() {
    fetchLogs();
    setInterval(fetchLogs, 10000); // Fetch logs every 10 seconds
};
</script>
</body>
</html>
